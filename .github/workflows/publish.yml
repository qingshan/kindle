# Build the kpm repository index and deploy it to GitHub Pages.
# Custom domain (set in repo Settings → Pages): kindle.qingshan.dev
#
# The kpm files are published under /repo/ so the existing add-repo URL
# https://kindle.qingshan.dev/repo/manifest.v2.json stays valid.
name: Deploy Repository

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Build repository index
        working-directory: repo
        run: |
          pip install -r index_builder/requirements.txt
          python index_builder/build_index.py
      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site/repo
          cp repo/manifest.v2.json repo/index.html _site/repo/
          # Domain root shows the same catalog; packages stay under /repo/
          # and artifact URLs point to each app's GitHub Release assets.
          cp repo/index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
